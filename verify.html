<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify Email - Bysecta</title>
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial;
    background: linear-gradient(180deg,#071535 3%, #0b274d 40%);
    color: #e6eef9;
    display:flex;
    align-items:center;
    justify-content:center;
    height:100vh;
    margin:0;
  }
  .card {
    width:100%;
    max-width:420px;
    background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
    border-radius:12px;
    padding:24px;
    box-shadow: 0 8px 30px rgba(2,8,23,0.6);
    border: 1px solid rgba(255,255,255,0.04);
    text-align:center;
  }
  h2 { margin-top:0; }
  .email-display { font-size:16px; font-weight:600; color:#8fd1ff; margin-bottom:20px; }
  .code-input { display:flex; justify-content:space-between; margin:20px 0; }
  .digit {
    width:50px;
    height:55px;
    font-size:22px;
    text-align:center;
    border-radius:8px;
    border:1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.05);
    color:#fff;
  }
  .btn { width:100%; padding:12px; border-radius:8px; background: linear-gradient(90deg,#0ea5ff,#0366ff); border:none; color:white; font-size:15px; cursor:pointer; margin-top:12px; }
  .muted { font-size:14px; color:#9fbff8; margin-top:12px; }
  .success-message { color:#8fffba; font-size:16px; margin-top:20px; font-weight:600; }
  .error-message { color:#ff7b7b; font-size:16px; margin-top:20px; font-weight:600; }
  .resend { cursor:pointer; color:#0ea5ff; text-decoration:underline; }

  /* Loading Overlay */
  .overlay {
    position: fixed; top:0; left:0; width:100%; height:100%;
    background: rgba(11, 39, 77, 0.9);
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    z-index:9999;
  }
  .spinner {
    width:50px; height:50px;
    border:4px solid rgba(255,255,255,0.3);
    border-top:4px solid #0ea5ff;
    border-radius:50%;
    animation: spin 1s linear infinite;
    margin-bottom:15px;
  }
  .loading-text { font-size:16px; color:#fff; }
  @keyframes spin { 0%{transform:rotate(0deg);} 100%{transform:rotate(360deg);} }

  /* Longer dashes for input */
  .digit::placeholder { letter-spacing: 4px; }
</style>
</head>
<body>

<div class="card">
  <h2>Verify Email Address</h2>
  <div id="showEmail" class="email-display"></div>
  <div class="code-input">
    <input maxlength="1" class="digit" type="text" placeholder="_">
    <input maxlength="1" class="digit" type="text" placeholder="_">
    <input maxlength="1" class="digit" type="text" placeholder="_">
    <input maxlength="1" class="digit" type="text" placeholder="_">
    <input maxlength="1" class="digit" type="text" placeholder="_">
    <input maxlength="1" class="digit" type="text" placeholder="_">
  </div>
  <button id="verifyBtn" class="btn">Verify Code</button>
  <div id="message" class="success-message"></div>
  <div class="muted">
    Didn’t receive the code? <span id="resendBtn" class="resend">Resend</span>
  </div>
</div>

<!-- Loading Overlay -->
<div class="overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-text">Verifying...</div>
</div>

<script>
const email = localStorage.getItem("bysecta_email") || "No email found";
document.getElementById("showEmail").textContent = email;

// Generate verification code immediately
const verificationCode = Math.floor(100000 + Math.random() * 900000);
localStorage.setItem("verification_code", verificationCode);

// Show code immediately to user
document.getElementById("message").textContent = `Your verification code: ${verificationCode}`;
document.getElementById("message").className = "success-message";

// Send email in background
emailjs.init("vXPk7MFT0iTsCxO7l");
if(email) {
  emailjs.send("service_ctvjqt8", "template_d997u9d", {
    code: verificationCode,
    to_email: email
  }).then(res => console.log("Email sent"), err => console.error("Email failed", err));
}

const overlay = document.getElementById("loadingOverlay");

document.getElementById("verifyBtn").addEventListener("click", () => {
  const inputs = document.querySelectorAll(".digit");
  let enteredCode = "";
  inputs.forEach(input => enteredCode += input.value);
  const savedCode = localStorage.getItem("verification_code");

  if(enteredCode === savedCode) {
    overlay.style.display = "flex";

    const users = JSON.parse(localStorage.getItem('bysecta_users') || '{}');
    if(users[email]) {
      users[email].verified = true;

      // ACCOUNT ID logic
      if(!users[email].accountID) {
        let lastID = localStorage.getItem('last_account_id') || '00000';
        let newID = (parseInt(lastID) + 1).toString().padStart(5,'0');
        users[email].accountID = newID;
        localStorage.setItem('last_account_id', newID);
      }

      localStorage.setItem('bysecta_users', JSON.stringify(users));
    }

    setTimeout(() => {
      overlay.style.display = "none";
      window.location.href = "confirmation.html";
    }, 1000);
  } else {
    document.getElementById("message").textContent = "❌ Invalid code. Please try again.";
    document.getElementById("message").className = "error-message";
  }
});

document.getElementById("resendBtn").addEventListener("click", () => {
  // Regenerate code instantly
  const newCode = Math.floor(100000 + Math.random() * 900000);
  localStorage.setItem("verification_code", newCode);
  document.getElementById("message").textContent = `Your verification code: ${newCode}`;
  document.getElementById("message").className = "success-message";

  // Send email again
  if(email) {
    emailjs.send("service_ctvjqt8", "template_d997u9d", {
      code: newCode,
      to_email: email
    }).then(res => console.log("Email sent"), err => console.error("Email failed", err));
  }
});
</script>

</body>
</html>
