<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Verify Email - Bysecta</title>
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial;
  background: linear-gradient(180deg,#071535 3%, #0b274d 40%);
  color: #e6eef9;
  display:flex;
  align-items:center;
  justify-content:center;
  height:100vh;
  margin:0;
}
.card {
  width:100%;
  max-width:420px;
  background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
  border-radius:12px;
  padding:24px;
  box-shadow: 0 8px 30px rgba(2,8,23,0.6);
  border: 1px solid rgba(255,255,255,0.04);
  text-align:center;
}
h2 { margin-top:0; }
.email-display { font-size:16px; font-weight:600; color:#8fd1ff; margin-bottom:20px; }

.code-container {
  position: relative;
  display: inline-block;
  width: 180px; /* Medium width for 6 digits */
  border-bottom: 3px solid #fff; /* Underscore style */
  margin: 20px 0;
  font-size: 24px;
  letter-spacing: 18px; /* spacing between digits */
  text-align: center;
  color: #fff;
}
.code-input {
  position: absolute;
  top: 0; left: 0;
  width:100%;
  border:none;
  background: transparent;
  outline:none;
  font-size:24px;
  color: #fff;
  letter-spacing: 18px;
  text-align: center;
}

.btn {
  width:100%;
  padding:12px;
  border-radius:8px;
  background: linear-gradient(90deg,#0ea5ff,#0366ff);
  border:none;
  color:white;
  font-size:15px;
  cursor:pointer;
  margin-top:12px;
}
.muted { font-size:14px; color:#9fbff8; margin-top:12px; }
.success-message { color:#8fffba; font-size:16px; margin-top:20px; font-weight:600; }
.error-message { color:#ff7b7b; font-size:16px; margin-top:20px; font-weight:600; }
.resend { cursor:pointer; color:#0ea5ff; text-decoration:underline; }

.overlay {
  position: fixed; top:0; left:0; width:100%; height:100%;
  background: rgba(11, 39, 77, 0.9);
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  z-index:9999;
}
.spinner {
  width:50px; height:50px;
  border:4px solid rgba(255,255,255,0.3);
  border-top:4px solid #0ea5ff;
  border-radius:50%;
  animation: spin 1s linear infinite;
  margin-bottom:15px;
}
.loading-text { font-size:16px; color:#fff; }
@keyframes spin { 0%{transform:rotate(0deg);} 100%{transform:rotate(360deg);} }
</style>
</head>
<body>

<div class="card">
  <h2>Verify Email Address</h2>
  <div id="showEmail" class="email-display"></div>
  
  <div class="code-container">
    <input id="codeInput" class="code-input" maxlength="6" type="text" placeholder="______" />
  </div>

  <button id="verifyBtn" class="btn">Verify Code</button>
  <div id="message" class="success-message"></div>
  <div class="muted">
    Didn’t receive the code? <span id="resendBtn" class="resend">Resend</span>
  </div>
</div>

<!-- Loading Overlay -->
<div class="overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-text">Verifying...</div>
</div>

<script>
const email = localStorage.getItem("bysecta_email");
document.getElementById("showEmail").textContent = email || "No email found";

emailjs.init("vXPk7MFT0iTsCxO7l");

function generateCode() {
  return Math.floor(100000 + Math.random() * 900000).toString();
}

function sendVerificationCode() {
  if(!email) return;
  const code = generateCode();
  localStorage.setItem("verification_code", code);

  emailjs.send("service_ctvjqt8", "template_d997u9d", {
    code: code,
    to_email: email
  }).then(() => {
    document.getElementById("message").textContent = "✅ Verification code sent!";
    document.getElementById("message").className = "success-message";
  }, () => {
    document.getElementById("message").textContent = "❌ Failed to send code. Try again.";
    document.getElementById("message").className = "error-message";
  });
}

// Auto-send code
window.addEventListener("load", sendVerificationCode);
document.getElementById("resendBtn").addEventListener("click", sendVerificationCode);

document.getElementById("verifyBtn").addEventListener("click", ()=>{
  const enteredCode = document.getElementById("codeInput").value.trim();
  const savedCode = localStorage.getItem("verification_code");

  if(enteredCode === savedCode){
    const overlay = document.getElementById("loadingOverlay");
    overlay.style.display = "flex";

    const users = JSON.parse(localStorage.getItem('bysecta_users')||'{}');
    if(users[email]){
      users[email].verified=true;
      if(!users[email].accountID){
        let lastID = localStorage.getItem('last_account_id')||'00000';
        let newID = (parseInt(lastID)+1).toString().padStart(5,'0');
        users[email].accountID = newID;
        localStorage.setItem('last_account_id', newID);
      }
      localStorage.setItem('bysecta_users', JSON.stringify(users));
    }

    setTimeout(()=>{overlay.style.display='none'; window.location.href="confirmation.html";},2000);
  } else {
    const msg = document.getElementById("message");
    msg.textContent="❌ Invalid code. Please try again.";
    msg.className="error-message";
  }
});
</script>

</body>
</html>
