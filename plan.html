<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Investment Plans</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: linear-gradient(180deg,#071535 3%,#0b274d 40%);
    color: #e6eef9;
    margin: 0;
    padding: 40px 20px;
    display: flex;
    justify-content: center;
  }
  .container {
    max-width: 1200px;
    width: 100%;
  }
  h1 {
    text-align: center;
    margin-bottom: 40px;
    font-size: 32px;
  }
  .plans-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 25px;
  }
  .plan-card {
    background: rgba(255,255,255,0.05);
    padding: 30px;
    border-radius: 15px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: 0.3s;
    border: 3px solid transparent;
    cursor: pointer;
    min-height: 250px;
  }
  .plan-card.selected {
    border-color: #0ff;
    background: rgba(14,165,255,0.2);
  }
  .plan-card h2 {
    margin: 0 0 15px 0;
    font-size: 24px;
  }
  .plan-card p {
    margin: 8px 0;
    font-size: 16px;
  }
  .plan-card .select-btn {
    margin-top: 20px;
    padding: 12px;
    background: #0ea5ff;
    border: none;
    border-radius: 10px;
    color: #fff;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
    transition: 0.2s;
  }
  .plan-card .select-btn:hover {
    background: #0366ff;
  }
  .results {
    margin-top: 50px;
    background: rgba(255,255,255,0.02);
    padding: 25px;
    border-radius: 15px;
    text-align: center;
    font-size: 18px;
  }

  /* Loading Overlay */
  .overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(11, 39, 77, 0.7);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    z-index: 9999;
  }
  .spinner {
    width: 50px;
    height: 50px;
    border: 4px solid rgba(255, 255, 255, 0.3);
    border-top: 4px solid orange;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-bottom: 15px;
  }
  .loading-text {
    font-size: 16px;
    color: #fff;
  }
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  @media (max-width: 900px) {
    h1 { font-size: 28px; }
    .plan-card { min-height: 230px; padding: 25px; }
  }
  @media (max-width: 600px) {
    h1 { font-size: 24px; }
    .plan-card { min-height: 200px; padding: 20px; }
  }
</style>
</head>
<body>

<div class="container">
  <h1>Choose Your Investment Plan</h1>

  <div class="plans-grid" id="plansContainer"></div>

  <div class="results" id="results">
    <p>Select a plan to see details</p>
  </div>
</div>

<!-- Loading Overlay -->
<div class="overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-text">Redirecting to deposit...</div>
</div>

<script>
  let userBalance = 50000; // Example user balance

  const plans = [
    { name: "Starter Plan", min: 200, max: 5000, return: 25000 },
    { name: "Silver Plan", min: 6000, max: 15000, return: 75000 },
    { name: "Gold Plan", min: 16000, max: 40000, return: 200000 },
    { name: "Platinum Plan", min: 41000, max: 80000, return: 400000 },
    { name: "Diamond Plan", min: 81000, max: 150000, return: 750000 }
  ];

  const container = document.getElementById('plansContainer');
  const results = document.getElementById('results');
  const overlay = document.getElementById('loadingOverlay');

  plans.forEach((plan, index) => {
    const card = document.createElement('div');
    card.classList.add('plan-card');
    if(userBalance >= plan.min) card.classList.add('affordable');

    card.dataset.index = index;

    card.innerHTML = `
      <div>
        <h2>${plan.name}</h2>
        <p>Investment: $${plan.min.toLocaleString()} - $${plan.max.toLocaleString()}</p>
        <p>Expected Return: $${plan.return.toLocaleString()}</p>
      </div>
      <button class="select-btn">
        Select Plan
      </button>
    `;
    container.appendChild(card);
  });

  // Handle plan selection and redirect
  container.addEventListener('click', e => {
    const card = e.target.closest('.plan-card');
    if(!card) return;

    document.querySelectorAll('.plan-card').forEach(c => c.classList.remove('selected'));
    card.classList.add('selected');

    const plan = plans[card.dataset.index];
    results.innerHTML = `
      <p><strong>Selected Plan:</strong> ${plan.name}</p>
      <p><strong>Investment Range:</strong> $${plan.min.toLocaleString()} - $${plan.max.toLocaleString()}</p>
      <p><strong>Expected Return:</strong> $${plan.return.toLocaleString()}</p>
    `;

    // Show loading and redirect
    overlay.style.display = 'flex';
    setTimeout(() => {
      window.location.href = 'deposit.html';
    }, 1500); // 1.5 seconds delay for loading
  });
</script>

</body>
</html>
