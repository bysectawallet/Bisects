<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=0" />
<title>Wallet Bysecta</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/css/intlTelInput.css"/>
<style>
.iti__country-list { background-color: #fff !important; color: #000 !important; }
.iti__country:hover { background-color: #f0f0f0 !important; }
.iti__selected-dial-code { color: #e6eef9 !important; }

* { box-sizing: border-box; }
html,body { height:108%; margin:0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial;
  background: linear-gradient(180deg,#071535 3%, #0b274d 40%);
  color: #e6eef9;
  display:flex; align-items:center; justify-content:center; padding:24px;
}
.card { width:100%; max-width:450px; background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01)); border-radius:12px; padding:18px; box-shadow: 0 8px 30px rgba(2,8,23,0.6); border: 1px solid rgba(255,255,255,0.04);}
.logo-row { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
h1.title { font-size:18px; margin:0; opacity:0.95; }
.tabs { display:flex; gap:8px; background: rgba(0,0,0,0.18); padding:8px; border-radius:10px; margin:14px 0; }
.tab { flex:1; text-align:center; padding:10px 6px; border-radius:8px; cursor:pointer; color:#bcd7ff; }
.tab.active { background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01)); color:#fff; }
label.section-label { display:block; margin:12px 0 6px; color:#9fc7ff; font-size:13px; }
.input { width:100%; margin-top:8px; padding:14px 12px; border-radius:10px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.04); color: #dbefff; font-size:15px; }
.small-row { display:flex; align-items:center; gap:10px; margin-top:12px; }
.checkbox { width:18px; height:18px; border-radius:4px; background:transparent; border:1px solid rgba(255,255,255,0.3); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:14px; color:white;}
.checkbox.checked { background:linear-gradient(90deg,#0ea5ff,#0066ff); border-color:transparent; }
.btn { width:100%; padding:12px 14px; border-radius:10px; font-size:15px; margin-top:12px; cursor:pointer; border:none; }
.btn.primary { background: linear-gradient(90deg,#0ea5ff,#0366ff); color:white; }
.btn:disabled { opacity:0.6; cursor:not-allowed; }
.muted { color:#9fbff8; font-size:13px; margin-top:10px; }
.footer { margin-top:14px; font-size:13px; color:#94bfff; text-align:center; }
.error { color:#ffb4b4; font-size:13px; margin-top:8px; }

.overlay {
  position: fixed;
  top:0; left:0;
  width:100%; height:100%;
  background: rgba(11, 39, 77, 0.9);
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  z-index:9999;
}
.spinner {
  width:50px; height:50px;
  border:4px solid rgba(255,255,255,0.3);
  border-top:4px solid #0ea5ff;
  border-radius:50%;
  animation: spin 1s linear infinite;
  margin-bottom:15px;
}
.loading-text {
  font-size:16px;
  color:#fff;
}
@keyframes spin { 0%{transform:rotate(0deg);} 100%{transform:rotate(360deg);} }
</style>
</head>
<body>

<div class="card" id="page-signup">
  <div class="logo-row">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQwSiUrrrLmZtADsq8_EOQWobImi5mFi1oTch-tPrYBPA&s" 
       alt="Bysecta Logo" 
       style="width:34px; height:34px; border-radius:8px; object-fit:contain;">
    <h1 class="title">Bysecta wallet</h1>
  </div>

  <div class="tabs">
    <div class="tab" id="tab-login">Log In</div>
    <div class="tab active" id="tab-signup">Sign Up</div>
  </div>

  <label class="section-label" for="phoneInput">Phone number</label>
  <input id="phoneInput" class="input" type="tel" placeholder="Phone number" />

  <label class="section-label" for="namelInput">Full Name</label>
  <input id="namelInput" class="input" type="text" placeholder="Full name" />

  <label class="section-label" for="emailInput">Email</label>
  <input id="emailInput" class="input" type="email" placeholder="Email address" />

  <label class="section-label" for="passwordInput">Password</label>
  <input id="passwordInput" class="input" type="password" placeholder="At least 6 letters" />

  <div class="small-row">
    <div id="promoCheck" class="checkbox" role="checkbox" aria-checked="false"></div>
    <div style="flex:1; font-size:14px; color:#d9ecff;">I'd like to receive exclusive offers and updates from bysecta.com</div>
  </div>

  <div id="errorEmail" class="error" style="display:none;">Please enter all fields correctly.</div>

  <button id="createBtn" class="btn primary" disabled>Create Account</button>

  <div class="muted">By submitting your email, you confirm you've read the relevant <span class="privacy-link">Privacy Notice</span>.</div>
  <div class="footer">accounts.bysecta.com</div>
</div>

<div class="overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-text">Creating your account...</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/js/intlTelInput.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script>
const createBtn = document.getElementById('createBtn');
const emailInput = document.getElementById('emailInput');
const passwordInput = document.getElementById('passwordInput');
const phoneInput = document.getElementById('phoneInput');
const nameInput = document.getElementById('namelInput');
const promoCheck = document.getElementById('promoCheck');
const overlay = document.getElementById("loadingOverlay");

const iti = window.intlTelInput(phoneInput, {
  initialCountry: "auto",
  preferredCountries: ["us","gb","ca"],
  geoIpLookup: function(success, failure) {
    fetch("https://ipapi.co/json")
      .then(res => res.json())
      .then(data => success(data.country_code))
      .catch(() => success("us"));
  },
  utilsScript: "https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/js/utils.js"
});

phoneInput.addEventListener('input', (e) => {
  let value = e.target.value.replace(/\D/g,'').slice(0,10);
  if(value.length > 6) value = value.replace(/(\d{3})(\d{3})(\d{1,4})/, '$1-$2-$3');
  else if(value.length > 3) value = value.replace(/(\d{3})(\d{1,3})/, '$1-$2');
  e.target.value = value;
});

function isValidName(name) { return /^[A-Za-z ]+$/.test(name); }

/* ✅ UPDATED PASSWORD VALIDATION */
function isValidPassword(pass) { return /^[A-Za-z0-9!@#$%^&*()_+=-]{6,}$/.test(pass); }

function checkForm() {
  if (emailInput.value.trim() !== "" &&
      phoneInput.value.trim() !== "" &&
      isValidName(nameInput.value.trim()) &&
      isValidPassword(passwordInput.value.trim())
  ) createBtn.disabled = false;
  else createBtn.disabled = true;
}

[emailInput, passwordInput, phoneInput, nameInput].forEach(input => input.addEventListener("input", checkForm));

promoCheck.addEventListener("click", () => {
  promoCheck.classList.toggle("checked");
  promoCheck.textContent = promoCheck.classList.contains("checked") ? "✓" : "";
});

emailjs.init("vXPk7MFT0iTsCxO7l");

createBtn.addEventListener('click', (e) => {
  e.preventDefault();
  const email = emailInput.value.trim().toLowerCase();
  const password = passwordInput.value.trim();
  const phone = phoneInput.value.trim();
  const fullname = nameInput.value.trim();

  if (!email || !phone || !isValidName(fullname) || !isValidPassword(password)) {
    document.getElementById('errorEmail').style.display = 'block';
    return;
  } else document.getElementById('errorEmail').style.display = 'none';

  const users = JSON.parse(localStorage.getItem("bysecta_users")) || {};
  users[email] = { password, phone, fullname, verified: false };
  localStorage.setItem("bysecta_users", JSON.stringify(users));
  localStorage.setItem("bysecta_email", email);

  const verificationCode = Math.floor(100000 + Math.random() * 900000);
  localStorage.setItem('verification_code', verificationCode);

  emailjs.send("service_ctvjqt8", "template_d997u9d", {
    to_name: email,
    code: verificationCode
  });

  overlay.style.display = "flex";
  setTimeout(() => {
    window.location.href = "verify.html";
  }, 2000);
});

document.getElementById('tab-login').addEventListener('click', () => {
  window.location.href = "login.html";
});
</script>
</body>
</html>
