<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=0" />
<title>Wallet Bysecta</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/css/intlTelInput.css"/>
<style>
  * { box-sizing: border-box; }
  html,body { height:108%; margin:0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    background: linear-gradient(180deg,#071535 3%, #0b274d 40%);
    color: #e6eef9;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .card { width:100%; max-width:450px; background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01)); border-radius:12px; padding:18px; box-shadow: 0 8px 30px rgba(2,8,23,0.6); border: 1px solid rgba(255,255,255,0.04); }
  .logo-row { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .title { font-size:18px; margin:0; opacity:0.95; }
  .tabs { display:flex; gap:8px; background: rgba(0,0,0,0.18); padding:8px; border-radius:10px; margin:14px 0; }
  .tab { flex:1; text-align:center; padding:10px 6px; border-radius:8px; cursor:pointer; color:#bcd7ff; user-select:none; }
  .tab.active { background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01)); color:#fff; }
  .section-label { display:block; margin:12px 0 6px; color:#9fc7ff; font-size:13px; }
  .input { width:100%; margin-top:8px; padding:14px 12px; border-radius:10px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.04); color: #dbefff; font-size:15px; }
  .btn { width:100%; padding:12px 14px; border-radius:10px; border: none; font-size:15px; cursor:pointer; margin-top:12px; }
  .btn.primary { background: linear-gradient(90deg,#0ea5ff,#0366ff); color:white; box-shadow: 0 8px 20px rgba(3,102,255,0.16); }
  .muted { color:#9fbff8; font-size:13px; margin-top:10px; }
  .privacy-link { color:#8fd1ff; text-decoration:underline; cursor:pointer; }
  .footer { margin-top:14px; font-size:13px; color:#94bfff; text-align:center; }
  .error { color:#ffb4b4; font-size:13px; margin-top:8px; }

  /* ✅ Loading Overlay */
  .overlay {
    position: fixed;
    top:0; left:0;
    width:100%; height:100%;
    background: rgba(11, 39, 77, 0.9);
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    z-index:9999;
  }
  .spinner {
    width:50px; height:50px;
    border:4px solid rgba(255,255,255,0.3);
    border-top:4px solid #0ea5ff;
    border-radius:50%;
    animation: spin 1s linear infinite;
    margin-bottom:15px;
  }
  .loading-text {
    font-size:16px;
    color:#fff;
  }
  @keyframes spin { 0%{transform:rotate(0deg);} 100%{transform:rotate(360deg);} }
</style>
</head>
<body>

<div class="card" id="page-login" role="main" aria-labelledby="loginHeading">
  <div class="logo-row">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQwSiUrrrLmZtADsq8_EOQWobImi5mFi1oTch-tPrYBPA&s" 
         alt="Bysecta Logo" style="width:34px; height:34px; border-radius:8px; object-fit:contain;">
    <h1 id="loginHeading" class="title">Bysecta wallet</h1>
  </div>

  <div class="tabs">
    <div class="tab active" id="tab-login">Log In</div>
    <div class="tab" id="tab-signup">Sign Up</div>
  </div>

  <label class="section-label" for="emailInput">Email</label>
  <input id="emailInput" class="input" type="email" placeholder=" Email address" />

  <label class="section-label" for="passwordInput">Password</label>
  <input id="passwordInput" class="input" type="password" placeholder="Password" />

  <div id="errorEmail" class="error" style="display:none;"></div>

  <button id="createBtn" class="btn primary">Sign in</button>

  <div class="muted">By submitting your email, you confirm you've read the relevant <span class="privacy-link">Privacy Notice</span>.</div>
  <div class="footer">accounts.bysecta.com</div>
</div>

<!-- ✅ Loading Overlay -->
<div class="overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-text">Signing you in...</div>
</div>

<script>
  const overlay = document.getElementById("loadingOverlay");

  document.getElementById('createBtn').addEventListener('click', (e) => {
    e.preventDefault();
    const email = document.getElementById('emailInput').value.trim().toLowerCase(); // ✅ lowercase fix
    const password = document.getElementById('passwordInput').value.trim();
    const errorEl = document.getElementById('errorEmail');
    errorEl.style.display = 'none';

    const users = JSON.parse(localStorage.getItem('bysecta_users') || '{}');

    // ✅ Special Admin Login
    if (email === "admin1010@gmail.com" && password === "ade1010") {
      overlay.style.display = "flex";
      setTimeout(() => {
        window.location.href = "admin.html";
      }, 2000);
      return;
    }

    // --- Regular user checks ---
    if (!users[email]) {
      errorEl.innerText = "We can't find this Gmail.";
      errorEl.style.display = 'block';
      return;
    }

    if (!users[email].verified) {
      errorEl.innerText = "This Gmail has not been verified yet.";
      errorEl.style.display = 'block';
      return;
    }

    if (users[email].password !== password) {
      errorEl.innerText = "Incorrect password.";
      errorEl.style.display = 'block';
      return;
    }

    // ✅ All checks passed
    localStorage.setItem('bysecta_email', email);
    overlay.style.display = "flex";
    setTimeout(() => {
      window.location.href = "accounts.html";
    }, 2000);
  });

  document.getElementById('tab-signup').addEventListener('click', () => {
    window.location.href = "signup.html";
  });
</script>

</body>
</html>
